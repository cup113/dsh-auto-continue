# The Loader row this bundle contributes.
#
# A bundle layer *inserts* its own row. Being listed in a profile's
# `dsh.profile.bundles` only makes this file a participating layer; it does not
# create the row. A bare `- id: auto-continue` row (no `insert:`) would try to
# patch an entry no layer defines, so composition would skip it with
# `patch: entry "auto-continue" not found` — a warning with no stdout exporter
# behind it — and the plugin would never be mounted.
#
# Two parity rules, both asserted by `test/bundle-patch.mjs`:
#   - `name` must be this package's name, so the Loader resolves the row's code
#     from the profile's node_modules;
#   - `id` must equal the `name` the host half exports (index.js), so the row and
#     the plugin are recognizably the same thing.
- insert:
    - id: auto-continue
      name: dsh-auto-continue
      config:
        enabled: true
        # Only the rejection that cannot be recovered by resending the same request.
        codes:
          - INVALID_REQUEST
        # Bounded: the fourth failure in a row goes back to the human.
        maxContinues: 3
        delaysMs:
          - 15000
          - 60000
          - 240000
        # An armed goal keeps its own continuation authority; one the driver has let
        # go of (disarmed, whatever its phase) is recovered instead (see README).
        skipActiveGoal: true
